<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1180" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2937">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <linearGradient id="gInput" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f0e1"/>
      <stop offset="1" stop-color="#e8dcb8"/>
    </linearGradient>
    <linearGradient id="gStage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="gEval" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="gTask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <style>
      .box{stroke:#334155;stroke-width:1.2;rx:8;ry:8}
      .title{font-weight:700;font-size:12px}
      .stage-title{font-weight:700;font-size:13px;fill:#0f172a}
      .caption{font-size:10px;fill:#475569}
      .arrow{stroke:#374151;stroke-width:1.4;fill:none;marker-end:url(#arr)}
      .arrowDash{stroke:#6b7280;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#arrDash)}
      .divider{stroke:#94a3b8;stroke-width:0.6;stroke-dasharray:2 3}
      .metric{font-size:10px}
      .lbl{font-size:10.5px;fill:#1f2937}
    </style>
  </defs>

  <!-- =============== TITLE =============== -->
  <text x="360" y="22" text-anchor="middle" font-weight="700" font-size="14" fill="#0f172a">
    Two-stage image-enhancement pipeline with three evaluation axes
  </text>

  <!-- =============== INPUT DATASETS =============== -->
  <text x="20" y="52" class="stage-title">Datasets</text>
  <line x1="0" y1="58" x2="720" y2="58" class="divider"/>

  <!-- In-house dataset -->
  <rect x="30" y="70" width="300" height="80" class="box" fill="url(#gInput)"/>
  <text x="180" y="90" text-anchor="middle" class="title">In-house S. clavuligerus (n = 68)</text>
  <text x="180" y="106" text-anchor="middle" class="caption">Smartphone photos · strains 33, H · manual counts</text>
  <text x="180" y="120" text-anchor="middle" class="caption">Defects: handwritten labels (100%), uneven light (25%),</text>
  <text x="180" y="134" text-anchor="middle" class="caption">background noise (24%), blur (16%), low resolution (6%)</text>

  <!-- Makrai dataset -->
  <rect x="390" y="70" width="300" height="80" class="box" fill="url(#gInput)"/>
  <text x="540" y="90" text-anchor="middle" class="title">Makrai (n = 20, subset of 4 species)</text>
  <text x="540" y="106" text-anchor="middle" class="caption">HR laboratory scans · sp04, sp09, sp19, sp22</text>
  <text x="540" y="120" text-anchor="middle" class="caption">2,991 COCO bounding boxes (colony-level GT)</text>
  <text x="540" y="134" text-anchor="middle" class="caption">Used as clean reference for bicubic × 4 degradation</text>

  <!-- Arrows down -->
  <line x1="180" y1="150" x2="180" y2="180" class="arrow"/>
  <line x1="540" y1="150" x2="540" y2="465" class="arrow"/>

  <!-- =============== STAGE 1: INPAINTING (in-house only) =============== -->
  <text x="20" y="200" class="stage-title">Stage 1 · Text removal (in-house)</text>
  <line x1="0" y1="206" x2="360" y2="206" class="divider"/>

  <!-- Mask variants -->
  <rect x="30" y="218" width="300" height="52" class="box" fill="url(#gStage)"/>
  <text x="180" y="235" text-anchor="middle" class="title">Mask generation (3 variants)</text>
  <text x="180" y="252" text-anchor="middle" class="lbl">Manual (LabelMe) · Manual + 5×5 dilation · Auto (threshold + 7×7 dilation)</text>

  <line x1="180" y1="270" x2="180" y2="290" class="arrow"/>

  <!-- Inpainters -->
  <rect x="30" y="292" width="300" height="76" class="box" fill="url(#gStage)"/>
  <text x="180" y="309" text-anchor="middle" class="title">Inpainting methods</text>
  <line x1="45" y1="316" x2="315" y2="316" stroke="#93c5fd" stroke-width="0.6"/>
  <rect x="45" y="323" width="82" height="38" fill="#fff" stroke="#60a5fa" stroke-width="0.8" rx="4"/>
  <text x="86" y="337" text-anchor="middle" class="lbl" font-weight="600">OpenCV Telea</text>
  <text x="86" y="352" text-anchor="middle" class="caption">radius 10 px</text>
  <rect x="139" y="323" width="82" height="38" fill="#fff" stroke="#60a5fa" stroke-width="0.8" rx="4"/>
  <text x="180" y="337" text-anchor="middle" class="lbl" font-weight="600">OpenCV NS</text>
  <text x="180" y="352" text-anchor="middle" class="caption">Navier–Stokes</text>
  <rect x="233" y="323" width="82" height="38" fill="#fff" stroke="#60a5fa" stroke-width="0.8" rx="4"/>
  <text x="274" y="337" text-anchor="middle" class="lbl" font-weight="600">LaMa</text>
  <text x="274" y="352" text-anchor="middle" class="caption">big-lama, no FT</text>

  <line x1="180" y1="368" x2="180" y2="388" class="arrow"/>

  <!-- D1 evaluation on inpainting -->
  <rect x="30" y="390" width="300" height="62" class="box" fill="url(#gEval)"/>
  <text x="180" y="407" text-anchor="middle" class="title">D1 · Reference-free evaluation (n = 68)</text>
  <text x="180" y="422" text-anchor="middle" class="lbl">NIQE ↓ · BRISQUE ↓ · EasyOCR ↓ · ReMOVE ↑ · Visual</text>
  <text x="180" y="440" text-anchor="middle" class="caption">Winner (visual + ReMOVE + NIQE) → LaMa on manual-dilated mask</text>

  <line x1="180" y1="452" x2="180" y2="480" class="arrow"/>

  <!-- =============== STAGE 2: SR (both paths) =============== -->
  <text x="20" y="500" class="stage-title">Stage 2 · Super-resolution (both datasets)</text>
  <line x1="0" y1="506" x2="720" y2="506" class="divider"/>

  <!-- Inpainted in-house output box -->
  <rect x="30" y="518" width="300" height="34" class="box" fill="url(#gOut)"/>
  <text x="180" y="540" text-anchor="middle" class="title">Inpainted in-house images (LaMa, manual-dilated)</text>

  <!-- Bicubic degradation box (Makrai path) -->
  <rect x="390" y="465" width="300" height="34" class="box" fill="url(#gStage)"/>
  <text x="540" y="486" text-anchor="middle" class="title">Bicubic ↓ × 4 (INTER_CUBIC, JPEG q 95)</text>
  <line x1="540" y1="500" x2="540" y2="518" class="arrow"/>
  <rect x="390" y="518" width="300" height="34" class="box" fill="url(#gOut)"/>
  <text x="540" y="540" text-anchor="middle" class="title">Matched LR ↔ HR pairs</text>

  <!-- Arrows down into SR box -->
  <line x1="180" y1="552" x2="180" y2="580" class="arrow"/>
  <line x1="540" y1="552" x2="540" y2="580" class="arrow"/>

  <!-- SR methods (shared) -->
  <rect x="30" y="582" width="660" height="76" class="box" fill="url(#gStage)"/>
  <text x="360" y="600" text-anchor="middle" class="title">Super-resolution models (4× upscaling, shared)</text>
  <line x1="60" y1="608" x2="660" y2="608" stroke="#93c5fd" stroke-width="0.6"/>
  <rect x="120" y="616" width="140" height="34" fill="#fff" stroke="#60a5fa" stroke-width="0.8" rx="4"/>
  <text x="190" y="631" text-anchor="middle" class="lbl" font-weight="600">Real-ESRGAN</text>
  <text x="190" y="645" text-anchor="middle" class="caption">RealESRGAN_x4plus · Colab T4</text>
  <rect x="290" y="616" width="140" height="34" fill="#fff" stroke="#60a5fa" stroke-width="0.8" rx="4"/>
  <text x="360" y="631" text-anchor="middle" class="lbl" font-weight="600">A-ESRGAN</text>
  <text x="360" y="645" text-anchor="middle" class="caption">A-ESRGAN-Multi · CUDA Linux</text>
  <rect x="460" y="616" width="140" height="34" fill="#fff" stroke="#60a5fa" stroke-width="0.8" rx="4"/>
  <text x="530" y="631" text-anchor="middle" class="lbl" font-weight="600">Swin2SR</text>
  <text x="530" y="645" text-anchor="middle" class="caption">swin2SR-x4-64-bsrgan · HF</text>

  <!-- Two evaluation branches -->
  <line x1="180" y1="658" x2="180" y2="688" class="arrow"/>
  <line x1="540" y1="658" x2="540" y2="688" class="arrow"/>

  <!-- D1 eval on SR (in-house) -->
  <rect x="30" y="690" width="300" height="60" class="box" fill="url(#gEval)"/>
  <text x="180" y="707" text-anchor="middle" class="title">D1 · Reference-free on SR (in-house)</text>
  <text x="180" y="722" text-anchor="middle" class="lbl">NIQE ↓ · BRISQUE ↓ · Visual (per-image)</text>
  <text x="180" y="740" text-anchor="middle" class="caption">Preferred: A-ESRGAN on sparse plates; Swin2SR on dense</text>

  <!-- D2 eval on SR (Makrai) -->
  <rect x="390" y="690" width="300" height="60" class="box" fill="url(#gEval)"/>
  <text x="540" y="707" text-anchor="middle" class="title">D2 · Reference-based (Makrai)</text>
  <text x="540" y="722" text-anchor="middle" class="lbl">PSNR ↑ · SSIM ↑ · LPIPS ↓  (n = 20)</text>
  <text x="540" y="740" text-anchor="middle" class="caption">Winner (pixel fidelity) → Swin2SR</text>

  <!-- Arrows down to counter -->
  <line x1="180" y1="750" x2="180" y2="820" class="arrow"/>
  <line x1="540" y1="750" x2="540" y2="820" class="arrow"/>

  <!-- =============== DOWNSTREAM COUNTING =============== -->
  <text x="20" y="785" class="stage-title">Downstream · Colony counting (fixed pipeline)</text>
  <line x1="0" y1="791" x2="720" y2="791" class="divider"/>

  <!-- Counter box -->
  <rect x="30" y="822" width="660" height="60" class="box" fill="url(#gTask)"/>
  <text x="360" y="840" text-anchor="middle" class="title">k-means + Hough colony counter (training-free, unchanged)</text>
  <text x="360" y="856" text-anchor="middle" class="lbl">Adaptive threshold → contours → k-means (k = 4) → top-3 clusters by circularity → per-cluster Hough Circles</text>
  <text x="360" y="871" text-anchor="middle" class="caption">Plate boundary auto-detected; wrapped from test_kmeans.py — official code, no logic changes</text>

  <!-- Arrows down to two eval boxes -->
  <line x1="180" y1="882" x2="180" y2="912" class="arrow"/>
  <line x1="540" y1="882" x2="540" y2="912" class="arrow"/>

  <!-- Downstream eval — in-house -->
  <rect x="30" y="914" width="300" height="80" class="box" fill="url(#gEval)"/>
  <text x="180" y="932" text-anchor="middle" class="title">Count-error (in-house, n = 20)</text>
  <text x="180" y="949" text-anchor="middle" class="lbl">MAE · RMSE · MAPE · Bias · R²</text>
  <text x="180" y="965" text-anchor="middle" class="caption">Stratified 5×5×5×5 across density bins</text>
  <text x="180" y="982" text-anchor="middle" class="caption">GT: manual counts (no bounding boxes)</text>

  <!-- Downstream eval — Makrai -->
  <rect x="390" y="914" width="300" height="80" class="box" fill="url(#gEval)"/>
  <text x="540" y="932" text-anchor="middle" class="title">Detection metrics (Makrai, n = 20)</text>
  <text x="540" y="949" text-anchor="middle" class="lbl">Precision · Recall · F1 at IoU = 0.5</text>
  <text x="540" y="965" text-anchor="middle" class="caption">pycocotools (official COCO API)</text>
  <text x="540" y="982" text-anchor="middle" class="caption">GT: 2,991 COCO bboxes across 4 species</text>

  <!-- Both arrows into synthesis -->
  <line x1="180" y1="994" x2="180" y2="1020" class="arrow"/>
  <line x1="540" y1="994" x2="540" y2="1020" class="arrow"/>

  <!-- Synthesis =============== -->
  <rect x="30" y="1022" width="660" height="60" class="box" fill="url(#gOut)"/>
  <text x="360" y="1040" text-anchor="middle" class="title">Cross-metric agreement · split verdict</text>
  <text x="360" y="1057" text-anchor="middle" class="lbl">Reference-free ranks A-ESRGAN first · Reference-based ranks Swin2SR first</text>
  <text x="360" y="1073" text-anchor="middle" class="caption">Downstream: A-ESRGAN wins F1 (Makrai) · Swin2SR wins MAE (in-house)</text>

  <!-- Caption -->
  <text x="360" y="1112" text-anchor="middle" font-style="italic" font-size="11" fill="#334155">
    Figure 1. Overview of the two-stage enhancement pipeline evaluated along three metric families
  </text>
  <text x="360" y="1126" text-anchor="middle" font-style="italic" font-size="11" fill="#334155">
    (reference-free, reference-based, and downstream task performance) on two datasets.
  </text>

  <!-- =============== LEGEND (bottom left) =============== -->
  <g transform="translate(30,1140)">
    <rect x="0" y="0" width="14" height="12" fill="url(#gInput)" stroke="#334155" stroke-width="0.8"/>
    <text x="18" y="10" font-size="10" fill="#334155">Input dataset</text>
    <rect x="105" y="0" width="14" height="12" fill="url(#gStage)" stroke="#334155" stroke-width="0.8"/>
    <text x="123" y="10" font-size="10" fill="#334155">Processing stage</text>
    <rect x="225" y="0" width="14" height="12" fill="url(#gEval)" stroke="#334155" stroke-width="0.8"/>
    <text x="243" y="10" font-size="10" fill="#334155">Evaluation</text>
    <rect x="315" y="0" width="14" height="12" fill="url(#gOut)" stroke="#334155" stroke-width="0.8"/>
    <text x="333" y="10" font-size="10" fill="#334155">Intermediate output</text>
    <rect x="440" y="0" width="14" height="12" fill="url(#gTask)" stroke="#334155" stroke-width="0.8"/>
    <text x="458" y="10" font-size="10" fill="#334155">Fixed downstream task</text>
  </g>
</svg>
